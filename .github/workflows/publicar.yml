name: Actualizar y publicar

# Cada 30 minutos descarga los RSS de los medios, agrupa las noticias y publica el sitio en GitHub Pages.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: noticias-ar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm test

      # El archivo de notas de las últimas 72 h y los resúmenes ya hechos pasan de una corrida a la siguiente.
      - name: Recuperar archivo anterior
        uses: actions/cache/restore@v4
        with:
          path: datos
          key: noticias-archivo-${{ github.run_id }}
          restore-keys: noticias-archivo-

      - name: Descargar y agrupar noticias
        env:
          # Opcional: con la clave, las noticias más cubiertas llevan titular y resumen neutrales hechos con Claude.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_RESUMENES: ${{ vars.MAX_RESUMENES || '15' }}
        run: npm run actualizar

      - name: Guardar archivo
        if: always()
        uses: actions/cache/save@v4
        with:
          path: datos
          key: noticias-archivo-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: publicar
        uses: actions/deploy-pages@v4
